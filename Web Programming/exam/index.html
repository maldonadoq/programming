<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización de Datos de Acceso</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header class="header">
        <h1>Actualización de Datos de Acceso</h1>
        <img src="logo.png" alt="utp logo" width="200px">
    </header>

    <main class="container">
        <form id="formAcceso">
            <label>DNI del Usuario</label>
            <input type="text" id="dni" placeholder="Ingrese DNI" required>

            <label>Contraseña Actual</label>
            <input type="password" id="contrasenha" placeholder="Ingrese Contraseña" required>

            <label>Nueva Contraseña</label>
            <input type="password" id="nuevaContrasenha" placeholder="Ingrese nueva Contraseña" required>

            <label>Confirmar nueva Contraseña</label>
            <input type="password" id="confirmarNuevaContrasenha" placeholder="Confirmar nueva Contraseña" required>
        </form>
    </main>
</body>

</html>
