<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Transición</title>

    <style>
        .box {
            width: 200px;
            height: 200px;
            background: indigo;
            transition: background 1s linear;

            &:hover {
                background: hotpink;
            }
        }
    </style>
</head>

<body>
    <div class="box"></div>
</body>

</html>
