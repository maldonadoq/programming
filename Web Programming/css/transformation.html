<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Transformación</title>

    <style>
        .element {
            width: 300px;
            height: 300px;
            background: skyblue;
            transform: translate(100px, 100px) rotate(45deg);
        }
    </style>

</head>

<body>
    <div class="element"></div>
</body>

</html>
