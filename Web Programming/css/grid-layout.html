<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flex</title>

    <style>
.grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    /* tres columnas iguales */
}
    </style>
</head>

<body>

<div class="grid-container">
    <div class="caja">A</div>
    <div class="caja">B</div>
    <div class="caja">C</div>
</div>

</body>

</html>
