<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flex</title>

    <style>
        body {
            background: skyblue;
        }

        .contenedor {
            border: 1px solid rgb(70, 69, 69);
            padding: 2px;
            width: 100%;
            height: 200px;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: baseline;
        }

        .item {
            background-color: beige;
            border: 1px solid rgb(70, 69, 69);
            height: 100px;
            width: 100px;
            margin: 5px;
            font-weight: bold;
            font-size: large;
            line-height: 100px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <div class="item">Caja 1</div>
        <div class="item">Caja 2</div>
        <div class="item">Caja 3</div>
        <div class="item">Caja 4</div>
        <div class="item">Caja 5</div>
    </div>

</body>

</html>
