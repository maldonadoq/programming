<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>

    <style>
        table,
        td,
        th {
            border: 1px solid black;
        }

        table {
            border-collapse: collapse;
        }

        .urgent {
            background-color: rgb(234, 171, 253);
        }

        .highlight {
            background-color: rgb(247, 239, 130);
        }
    </style>

</head>

<body>
    <table width="500" height="100">
        <col class="urgent" />
        <colgroup class="highlight" span="2"></colgroup>
        <tr>
            <th>Column 1</th>
            <th>Column 2</th>
            <th>Column 3</th>
        </tr>
        <tr>
            <td>1,1</td>
            <td>1,2</td>
            <td>1,3</td>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
    </table>
</body>

</html>
