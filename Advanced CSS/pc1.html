<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC1 CSS</title>
    <style>
        body {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto auto 1fr auto;
        }

        header,
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: #555;
            color: white;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            padding: 10px;
            background: #f0f0f0;
        }

        .main {
            background: #ddd;
            padding: 20px;
        }

        .aside {
            background: #bbb;
            padding: 20px;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: center;
            }

            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>Práctica Calificada 1</h2>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Servicios</a>
        <a href="#">Contacto</a>
    </nav>

    <div class="container">
        <div class="main">Contenido Principal</div>
        <div class="aside">Barra Lateral</div>
    </div>

    <footer>
        <p>Práctica Calificada - UTP</p>
    </footer>
</body>

</html>
