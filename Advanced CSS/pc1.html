<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC1 CSS</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            background: #f4f6fb;
        }

        header,
        footer {
            background: #8a341e;
            color: white;
            text-align: center;
            padding: 15px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #eb3c25;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 15px;
            padding: 15px;
        }

        .main {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* GRID INTERNO */
        .grid-boxes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .box {
            background: #f6803b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }
        
        .aside {
            background: #e0e7ff;
            padding: 20px;
            border-radius: 10px;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .grid-boxes {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: center;
            }

            .container {
                grid-template-columns: 1fr;
            }

            .grid-boxes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>Práctica Calificada 1</h2>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Servicios</a>
        <a href="#">Contacto</a>
    </nav>

    <div class="container">
        <div class="main">
            <h3>Contenido Principal</h3>

            <div class="grid-boxes">
                <div class="box">Caja 1</div>
                <div class="box">Caja 2</div>
                <div class="box">Caja 3</div>
                <div class="box">Caja 4</div>
                <div class="box">Caja 5</div>
                <div class="box">Caja 6</div>
                <div class="box">Caja 7</div>
                <div class="box">Caja 8</div>
            </div>
        </div>

        <div class="aside">
            <h3>Barra Lateral</h3>
            <p>Contenido adicional</p>
        </div>
    </div>

    <footer>
        <p>Práctica Calificada - UTP</p>
    </footer>
</body>

</html>
